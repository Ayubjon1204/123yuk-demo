services:
  - type: web
    name: 123yuk-ai-support-demo-api
    runtime: python
    plan: free
    branch: feature/ai-support-agent
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    autoDeployTrigger: off
    healthCheckPath: /health/ready
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.14"
      - key: GEMINI_FREE_TIER_CONFIRMED
        value: "false"
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: DEMO_NOW
        value: "2026-10-10T07:00:00Z"
      - key: CORS_ALLOWED_ORIGINS
        value: "http://localhost:8080,http://127.0.0.1:8080"
  - type: web
    name: yuk-zavod-ai-preview
    runtime: static
    branch: feature/ai-support-agent
    buildCommand: node scripts/build_zavod_preview.js
    staticPublishPath: dist/zavod-preview
    autoDeployTrigger: off
    envVars:
      - key: PREVIEW_API_BASE_URL
        value: https://one23yuk-ai-support-demo-api.onrender.com
