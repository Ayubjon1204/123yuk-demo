<script>(function(){
var D=JSON.parse(document.getElementById('d').textContent);
var SL=['Boshlanmagan','Jarayonda','To‘xtagan','Bajarildi'],NOW=['Navbatda','Hozir','To‘xtab qolgan'];
var M=['yanvar','fevral','mart','aprel','may','iyun','iyul','avgust','sentabr','oktabr','noyabr','dekabr'];
function e(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pd(s){if(!/^\d{4}-\d{2}-\d{2}$/.test(s||''))return null;var a=s.split('-').map(Number),d=new Date(a[0],a[1]-1,a[2]);return d.getMonth()===a[1]-1?d:null}
function fd(s){var d=pd(s);return d?('0'+d.getDate()).slice(-2)+'.'+('0'+(d.getMonth()+1)).slice(-2)+'.'+d.getFullYear():''}
function left(s){var d=pd(s);if(!d)return null;var t=new Date();t.setHours(0,0,0,0);return Math.round((d-t)/864e5)}
function rel(n){if(n==null)return'';if(n===0)return'bugun';if(n===1)return'ertaga';if(n<0)return(-n)+' kun kechikdi';if(n>60)return Math.round(n/30.4)+' oy qoldi';return n+' kun qoldi'}
var P=D.p.map(function(r){return{id:r[0],name:r[1],sum:r[2]}});
var S=D.s.map(function(r){return{id:r[0],pid:r[1],g:r[2],name:r[3],sum:r[4],terms:r[5]||[]}});
var T=D.t.map(function(r){return{sid:r[0],title:r[1],owner:r[2],resp:r[3],dl:r[4],dr:r[5],st:r[6],note:r[7]}});
function secs(pid){return S.filter(function(s){return s.pid===pid})}
function tasks(sid){return T.filter(function(t){return t.sid===sid})}
function ptasks(pid){var o=[];secs(pid).forEach(function(s){o=o.concat(tasks(s.id))});return o}
function now(ts){return ts.find(function(t){return t.st===1})||ts.find(function(t){return t.st===2})||ts.find(function(t){return t.st!==3})||null}
function cnt(ts){var c=[0,0,0,0];ts.forEach(function(t){c[t.st]++});return c}
function bar(c){var n=c[0]+c[1]+c[2]+c[3]||1;return'<span class="bar"><i class="b3" style="width:'+c[3]/n*100+'%"></i><i class="b1" style="width:'+c[1]/n*100+'%"></i><i class="b2" style="width:'+c[2]/n*100+'%"></i></span>'}
function short(n){return String(n).replace(/\s*\(.*\)\s*$/,'')}
var st={v:'o',p:P[0]&&P[0].id,s:{}};
try{var sv=JSON.parse(localStorage.getItem('reja-public')||'{}');if(sv.v)st.v=sv.v;if(sv.p)st.p=sv.p;if(sv.s)st.s=sv.s}catch(x){}
function save(){try{localStorage.setItem('reja-public',JSON.stringify(st))}catch(x){}}
function dl(t){if(!pd(t.dl))return'Dedlayn yo‘q';var n=left(t.dl);return(t.dr?'Taxminiy dedlayn':'Dedlayn')+': <b'+(n<0&&t.st!==3?' class="late"':'')+'>'+fd(t.dl)+'</b> · '+(t.st===3?'bajarilgan':rel(n))}
function who(t){return t.owner?'<b>'+e(t.owner)+'</b>':'<b class="m">tayinlanmagan</b>'}
function overview(){
  var h='<div><span class="lbl">'+P.length+' ta loyiha · ketma-ketlik bo‘yicha</span></div><div class="cards">';
  P.forEach(function(p,i){var ts=ptasks(p.id),c=cnt(ts),n=now(ts);
    h+='<button type="button" class="card" data-p="'+e(p.id)+'"><span class="n">'+(i+1)+'</span><span class="hd"><span class="nm">'+e(p.name)+'</span><span class="ct">'+c[3]+'/'+ts.length+'</span></span>'+bar(c);
    if(n)h+='<span class="k">'+NOW[n.st]+':</span><span class="v">'+e(n.title)+'</span><span class="f">Kim qiladi: '+who(n)+'<br>'+dl(n)+'</span>';
    else h+='<span class="k">'+(ts.length?'Hamma qadamlar bajarildi':'Hali qadam yo‘q')+'</span>';
    h+='</button>'});
  return h+'</div><p class="lg">Kartani bosing: loyihaning bo‘limlari va qadamlari ochiladi.</p>'}
function project(){
  var p=P.find(function(x){return x.id===st.p})||P[0];if(!p)return'';st.p=p.id;var pi=P.indexOf(p)+1;
  var h='<div class="row" id="pr">'+P.map(function(x,i){var ts=ptasks(x.id),c=cnt(ts);return'<button type="button" class="st" data-p="'+e(x.id)+'" aria-current="'+(x.id===p.id)+'"><span class="x">'+(i+1)+'</span>'+e(short(x.name))+'<span class="c">'+c[3]+'/'+ts.length+'</span></button>'}).join('')+'</div>';
  var ss=secs(p.id),pts=ptasks(p.id),pc=cnt(pts);
  var s=ss.find(function(x){return x.id===st.s[p.id]});
  if(!s){var n=now(pts);s=(n&&ss.find(function(x){return x.id===n.sid}))||ss[0]}
  h+='<header class="ph"><div class="n">'+pi+'</div><div><h2>'+e(p.name)+'</h2>'+(p.sum?'<p>'+e(p.sum)+'</p>':'')+'<span class="ct">'+pc[3]+'/'+pts.length+' bajarildi</span></div></header>';
  if(!s)return h+'<p class="lg">Bu loyihada hali bo‘lim yo‘q.</p>';
  h+='<div class="row" id="sr">'+ss.map(function(x,i){var c=cnt(tasks(x.id));return'<button type="button" class="st sm" data-s="'+e(x.id)+'" aria-current="'+(x.id===s.id)+'" title="'+e(x.name)+'">'+(/^\d/.test(x.name)?'':'<span class="x">'+(i+1)+'</span>')+'<span class="t">'+e(x.name)+'</span><span class="c">'+c[3]+'/'+tasks(x.id).length+'</span></button>'}).join('')+'</div>';
  var ts=tasks(s.id),cur=now(ts);
  h+='<article class="sec"><div class="sh">'+(s.g?'<span class="eb">'+e(s.g)+'</span>':'')+'<h3>'+e(s.name)+'</h3>'+(s.sum?'<p class="ss">'+e(s.sum)+'</p>':'')+(s.terms.length?'<ul class="terms">'+s.terms.map(function(x){return'<li>'+e(x)+'</li>'}).join('')+'</ul>':'')+'</div>';
  h+=ts.length?'<ol class="steps">'+ts.map(function(t,i){return'<li class="step s'+t.st+'"><span class="dot">'+(t.st===3?'✓':i+1)+'</span><div><div class="tt">'+e(t.title)+(t===cur?' <span class="tag s'+t.st+'">'+(t.st===0?'navbatda':SL[t.st])+'</span>':'')+'</div>'+
    '<div class="fx"><span><span class="k">Kim qiladi:</span> '+(t.owner?e(t.owner):'<span class="m">tayinlanmagan</span>')+'</span>'+(t.resp?'<span><span class="k">Nimaga mas’ul:</span> '+e(t.resp)+'</span>':'')+'</div>'+
    '<div class="fx"><span>'+dl(t)+'</span><span class="tag s'+t.st+'">'+SL[t.st]+'</span></div>'+(t.note?'<p class="note">'+e(t.note)+'</p>':'')+'</div></li>'}).join('')+'</ol>':'<p class="lg" style="padding:16px 18px">Bu bo‘limda hali qadam yo‘q.</p>';
  h+='</article>';var si=ss.indexOf(s);
  if(ss.length>1)h+='<div class="nav">'+(si>0?'<button type="button" class="btn" data-s="'+e(ss[si-1].id)+'" data-nav="1">← Oldingi bo‘lim</button>':'<span></span>')+(si<ss.length-1?'<button type="button" class="btn" data-s="'+e(ss[si+1].id)+'" data-nav="1">Keyingi bo‘lim →</button>':'')+'</div>';
  if(ts.some(function(t){return t.dr}))h+='<p class="lg">“Taxminiy dedlayn” — sana hali jamoa bilan kelishilmagan.</p>';
  return h}
function render(){
  document.querySelectorAll('.tab').forEach(function(b){b.setAttribute('aria-current',String(b.dataset.v===st.v))});
  var m=document.getElementById('m'),at=fd(D.at);
  m.innerHTML='<p class="ban">Rejaning '+e(at)+' holati. Bu sahifa faqat ko‘rish uchun.</p>'+(st.v==='p'?project():overview());
  m.querySelectorAll('.row').forEach(function(r){var a=r.querySelector('[aria-current="true"]');if(a&&r.scrollWidth>r.clientWidth){var rb=r.getBoundingClientRect(),ab=a.getBoundingClientRect();if(ab.left<rb.left||ab.right>rb.right)r.scrollLeft+=(ab.left-rb.left)-(rb.width-ab.width)/2}})}
document.addEventListener('click',function(ev){var b=ev.target.closest('button');if(!b)return;
  if(b.classList.contains('tab')){st.v=b.dataset.v;save();render();scrollTo(0,0);return}
  if(b.dataset.p){st.v='p';st.p=b.dataset.p;save();render();if(b.classList.contains('card'))scrollTo(0,0);return}
  if(b.dataset.s){st.s[st.p]=b.dataset.s;save();render();if(b.dataset.nav){var r=document.getElementById('sr');if(r)r.scrollIntoView({block:'start'})}}});
render();
})();</script>
