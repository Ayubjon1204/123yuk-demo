<meta property="og:type" content="website">
<meta property="og:title" content="Loyihalar ketma-ketligi">
<meta property="og:description" content="6 ta loyiha ketma-ketlikda: Ekspeditorlik → Garaj → Presep → Qozog‘iston → 123yuk → Lorry. Bo‘limlar, qadamlar, kim qiladi, dedlayn va holat.">
<meta name="theme-color" content="#F1F3F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E141A" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Cdefs%3E%3Cpattern%20id%3D%22s%22%20width%3D%228%22%20height%3D%228%22%20patternUnits%3D%22userSpaceOnUse%22%20patternTransform%3D%22rotate%2845%29%22%3E%3Crect%20width%3D%224%22%20height%3D%228%22%20fill%3D%22%23EE9A12%22%2F%3E%3Crect%20x%3D%224%22%20width%3D%224%22%20height%3D%228%22%20fill%3D%22%2316202A%22%2F%3E%3C%2Fpattern%3E%3C%2Fdefs%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%227%22%20fill%3D%22url%28%23s%29%22%2F%3E%3C%2Fsvg%3E">

<title>Loyihalar ketma-ketligi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: a dispatch-style route sheet. The overview is one plain card per project, in sequence.
   The projects view shows one project and one section at a time through two rows of sub-tabs;
   each step is a numbered stop on a route line (solid = travelled). */
:root{
  --bg:#F1F3F5; --surface:#FFFFFF; --surface-2:#E7EBEF; --ink:#16202A; --ink-2:#4A5866; --ink-3:#5E6A76; --line:#D2D9E0;
  --accent:#EE9A12; --accent-ink:#8F5400; --accent-soft:#FCEACB; --on-accent:#1C1300;
  --done:#17733E; --done-soft:#DBEFE2; --doing:#2360C4; --doing-soft:#DCE6F7;
  --blocked:#BF372B; --blocked-soft:#FAE6E3; --todo:#5A6773; --todo-soft:#E3E8EC; --on-sem:#FFFFFF;
  --shadow-sm:0 1px 2px rgba(22,32,42,.08);
  --shadow-lg:0 12px 40px rgba(22,32,42,.18);
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E141A; --surface:#161F28; --surface-2:#1E2A35; --ink:#E5EBF0; --ink-2:#A6B3BF; --ink-3:#8593A0; --line:#2A3743;
    --accent:#F2A93B; --accent-ink:#F5BB5E; --accent-soft:#3A2A0F; --on-accent:#1C1300;
    --done:#4DC27F; --done-soft:#14301F; --doing:#70A3F5; --doing-soft:#172A47;
    --blocked:#F07A6E; --blocked-soft:#3D1B17; --todo:#8D9AA6; --todo-soft:#232E38; --on-sem:#0E141A;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 12px 40px rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E141A; --surface:#161F28; --surface-2:#1E2A35; --ink:#E5EBF0; --ink-2:#A6B3BF; --ink-3:#8593A0; --line:#2A3743;
  --accent:#F2A93B; --accent-ink:#F5BB5E; --accent-soft:#3A2A0F; --on-accent:#1C1300;
  --done:#4DC27F; --done-soft:#14301F; --doing:#70A3F5; --doing-soft:#172A47;
  --blocked:#F07A6E; --blocked-soft:#3D1B17; --todo:#8D9AA6; --todo-soft:#232E38; --on-sem:#0E141A;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 12px 40px rgba(0,0,0,.55);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-stretch:112%;text-wrap:balance;margin:0;line-height:1.15}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.k{color:var(--ink-3)}
.mono{font-family:var(--f-mono)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:10px 20px;flex-wrap:wrap;padding-block:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1 1 300px}
.brand-mark{width:30px;height:30px;border-radius:6px;flex:none;background:repeating-linear-gradient(135deg,var(--accent) 0 6px,var(--ink) 6px 12px);box-shadow:inset 0 0 0 2px var(--accent)}
.brand h1{font-size:19px;font-weight:800;letter-spacing:-.005em}
.brand p{color:var(--ink-2);font-size:13px}
.tabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:10px}
.tab{border:0;background:transparent;padding:7px 14px;border-radius:7px;font-weight:600;font-size:14px;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
.top-actions{display:flex;align-items:center;gap:10px}
.save-state{font:500 12px var(--f-mono);color:var(--ink-3);white-space:nowrap}
/* the save note sits on the header's bottom edge so it never reflows the header */
.top-in{position:relative}
.save-state{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:-8px;padding:0 6px;line-height:16px;background:var(--bg);pointer-events:none;z-index:1}
.save-state:empty{display:none}
@media (max-width:860px){.tabs{order:3;flex:1 1 100%}.tab{flex:1}}
@media (max-width:700px){
  .brand p{display:none}
  .brand{flex:1 1 0}
  .brand h1{font-size:16px}
  .brand-mark{width:26px;height:26px}
  .top-actions .btn{padding:7px 11px}
  .tabs{order:3;flex:1 1 100%}
  .tab{flex:1;padding-inline:4px;font-size:13px}
}

/* main */
main.wrap{padding-block:20px 72px;display:flex;flex-direction:column;gap:22px}
.notice{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px 24px;display:grid;gap:10px;max-width:640px}
.notice h2{font-size:20px}
.notice p{color:var(--ink-2)}
.banner{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:14px;color:var(--ink-2)}
.banner a{color:var(--accent-ink);font-weight:600;overflow-wrap:anywhere}
.banner .link-btn{font-size:14px;margin-left:4px}
.loading-rows{display:grid;gap:10px}
.loading-rows span{display:block;height:64px;border-radius:12px;background:var(--surface-2)}
@media (prefers-reduced-motion:no-preference){
  .loading-rows span{animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.55}}
}

/* overview: one plain card per project, in sequence */
.ov{display:grid;gap:14px}
.ov-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px 20px;flex-wrap:wrap}
.label{font:500 11.5px var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.ov-head .today{font-size:13.5px;color:var(--ink-2);margin-top:2px}
.overall{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--ink-2);flex:0 1 380px;min-width:240px}
.overall strong{font-family:var(--f-display);font-stretch:112%;font-size:24px;color:var(--ink);font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.overall .bar{flex:1}
.bar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--todo-soft);width:100%}
.bar i{display:block;height:100%}
.bar .b-done{background:var(--done)} .bar .b-doing{background:var(--doing)} .bar .b-blocked{background:var(--blocked)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.kpi{display:grid;gap:2px;align-content:start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;min-width:0;color:var(--ink)}
.kpi:hover:not(:disabled){border-color:var(--ink-3)}
.kpi:disabled{cursor:default}
.kpi strong{font-family:var(--f-display);font-stretch:112%;font-weight:800;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;color:var(--ink-2);line-height:1.25}
.kpi.alert strong{color:var(--blocked)} .kpi.warn strong{color:var(--accent-ink)} .kpi.zero strong{color:var(--ink-3)}
@media (max-width:560px){.kpis{gap:6px}.kpi{padding:8px}.kpi strong{font-size:19px}.kpi span{font-size:11px}}
.pcards{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
@media (min-width:760px){.pcards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1080px){.pcards{grid-template-columns:repeat(3,minmax(0,1fr))}}
.pcard{display:grid;grid-template-columns:38px minmax(0,1fr);gap:2px 12px;align-content:start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px 16px;cursor:pointer;min-width:0;color:var(--ink)}
.pcard:hover{border-color:var(--ink-3)}
.pcard > span{display:block;grid-column:2;min-width:0}
.pcard > .pc-num{grid-column:1;grid-row:1 / span 6;font-family:var(--f-display);font-weight:800;font-stretch:125%;font-size:34px;line-height:1;color:var(--accent-ink);font-variant-numeric:tabular-nums}
.pcard > .pc-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.pc-name{font-family:var(--f-display);font-stretch:112%;font-weight:800;font-size:18px;line-height:1.2}
.pc-count{font:500 12.5px var(--f-mono);color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.pcard > .bar{display:flex;height:6px;margin-top:6px}
.pcard > .pc-k{margin-top:10px;font-size:12.5px;color:var(--ink-3)}
.pcard > .pc-v{font-size:14.5px;font-weight:600;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pcard > .pc-facts{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;margin-top:8px;font-size:13px;color:var(--ink-2)}
.pc-facts b,.pc-own b{font-weight:600;color:var(--ink)}
.pc-facts b.miss,.pc-own b.miss{color:var(--accent-ink)}
.pcard > .pc-own{margin-top:8px;font-size:13px;line-height:1.4;color:var(--ink-2);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pcard > .pc-own + .pc-own{margin-top:2px}
.pc-facts .late{color:var(--blocked);font-weight:600}
.pc-facts > span{min-width:0;overflow-wrap:anywhere}
.pcard > .pc-alert{margin-top:8px;font-size:13px;color:var(--blocked);font-weight:600}
.stag{display:inline-flex;align-items:center;gap:6px;font:600 12px var(--f-body);padding:2px 9px;border-radius:99px;color:var(--todo);background:var(--todo-soft);white-space:nowrap}
.stag::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.stag.s-doing{color:var(--doing);background:var(--doing-soft)}
.stag.s-blocked{color:var(--blocked);background:var(--blocked-soft)}
.stag.s-done{color:var(--done);background:var(--done-soft)}
.legend{font-size:12.5px;color:var(--ink-3)}

/* sub-tabs: the six projects in order, then the chosen project's sections */
.subtabs{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;margin:0 -2px;scrollbar-width:thin}
.stab{flex:none;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:10px;padding:9px 13px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.stab:hover{border-color:var(--ink-3);color:var(--ink)}
.stab[aria-current="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.stab .n{font:800 14px var(--f-display);font-stretch:125%;color:var(--accent-ink)}
.stab[aria-current="true"] .n{color:inherit}
.stab .c{font:500 12px var(--f-mono);opacity:.75;font-variant-numeric:tabular-nums}
.stab.small{border-radius:99px;padding:7px 12px;font-size:13.5px}
.stab.add{border-style:dashed;background:transparent;color:var(--accent-ink)}
.sectabs{display:flex;flex-wrap:wrap;gap:6px}
@media (max-width:640px){
  .sectabs{flex-wrap:nowrap;overflow-x:auto;padding:2px 2px 8px;margin:0 -2px}
  .stab .t{max-width:210px;overflow:hidden;text-overflow:ellipsis}
  /* a long project description is folded to three lines on phones; "Batafsil" opens it */
  .proj-head .psum{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .proj-head.full .psum{display:block}
}
@media (min-width:641px){.more-btn{display:none}}
.more-btn{margin-top:4px}
.secnav{display:flex;justify-content:space-between;gap:10px}
.filterbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding:10px 14px;background:var(--accent-soft);border-radius:10px;font-size:14px;color:var(--ink)}

/* project route */
.view{display:grid;gap:34px}
.proj{display:grid;gap:14px}
.proj-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 16px;align-items:start;padding-bottom:12px;border-bottom:2px solid var(--ink)}
.proj-num{font-family:var(--f-display);font-weight:800;font-stretch:125%;font-size:44px;line-height:.85;color:var(--accent-ink);font-variant-numeric:tabular-nums}
.proj-head h2{font-size:26px;font-weight:800}
.proj-head p{margin-top:4px;color:var(--ink-2);max-width:72ch}
.pfacts{display:grid;gap:2px;margin-top:6px;font-size:14px;line-height:1.45;color:var(--ink);max-width:72ch;overflow-wrap:anywhere}
.pfacts b{font-weight:600}
.pfacts b.miss{color:var(--accent-ink)}
.proj-side{display:grid;justify-items:end;gap:8px;text-align:right}
.proj-side .mono{font-size:12.5px;color:var(--ink-2);white-space:nowrap}
@media (max-width:640px){
  .proj-head{grid-template-columns:auto minmax(0,1fr)}
  .proj-side{grid-column:1 / -1;justify-items:start;text-align:left;grid-auto-flow:column;justify-content:space-between;align-items:center}
  .proj-head h2{font-size:22px}
  .proj-num{font-size:36px}
}
.group-label{font:600 11.5px var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);display:flex;align-items:center;gap:10px;margin-top:4px}
.group-label::after{content:"";flex:1;border-top:1px dashed var(--line)}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sec-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px 18px;padding:16px 18px 14px;border-bottom:1px solid var(--line)}
.eyebrow{font:500 11.5px var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--accent-ink)}
.sec-head h3{font-size:18px;font-weight:700;margin-top:2px}
.sec-sum{margin-top:4px;color:var(--ink-2);font-size:14px;max-width:72ch}
.terms{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.terms li{font-size:12.5px;line-height:1.35;padding:4px 9px;border-radius:6px;background:var(--accent-soft);color:var(--ink)}
.sec-side{display:grid;justify-items:end;align-content:start;gap:7px;min-width:120px}
.sec-count{font:500 13px var(--f-mono);color:var(--ink-2);font-variant-numeric:tabular-nums}
.sec-side .bar{width:120px}
@media (max-width:560px){
  .sec-head{grid-template-columns:minmax(0,1fr)}
  .sec-side{justify-items:start;grid-auto-flow:column;align-items:center;justify-content:start;gap:12px}
}
.link-btn{border:0;background:transparent;padding:2px 0;font-size:13px;font-weight:600;color:var(--accent-ink);cursor:pointer}
.link-btn:hover{text-decoration:underline}
.steps{list-style:none;margin:0;padding:16px 18px 2px}
.step{position:relative;display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:6px 14px;padding-bottom:20px}
.step::after{content:"";position:absolute;left:15px;top:36px;bottom:4px;border-left:2px dashed var(--line)}
.step:last-child::after{display:none}
.step.s-done::after{border-left-style:solid;border-color:var(--done)}
.marker{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);background:var(--surface);font:700 13px var(--f-display);color:var(--ink-3);position:relative;z-index:1;font-variant-numeric:tabular-nums}
.marker svg{width:15px;height:15px}
.s-doing .marker{background:var(--doing);border-color:var(--doing);color:var(--on-sem)}
.s-done .marker{background:var(--done);border-color:var(--done);color:var(--on-sem)}
.s-blocked .marker{background:var(--blocked-soft);border-color:var(--blocked);color:var(--blocked)}
.is-current .marker{box-shadow:0 0 0 4px var(--accent-soft)}
.s-todo.is-current .marker{border-color:var(--accent);color:var(--accent-ink)}
.step-body{min-width:0;padding-top:4px}
.title{display:inline;border:0;background:none;padding:0;text-align:left;font-weight:600;font-size:15.5px;line-height:1.4;color:var(--ink);cursor:pointer}
.title:hover{text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:3px}
.s-done .title{color:var(--ink-2)}
.now-tag{display:inline-block;font:600 10.5px var(--f-mono);letter-spacing:.1em;background:var(--accent);color:var(--on-accent);padding:1px 6px;border-radius:4px;margin-left:8px;vertical-align:2px}
.facts{display:flex;flex-wrap:wrap;gap:2px 18px;font-size:13.5px;color:var(--ink-2);margin-top:4px}
.who.missing .v{color:var(--accent-ink);border-bottom:1px dashed var(--accent-ink)}
.note{margin-top:6px;font-size:13.5px;color:var(--ink-2);border-left:2px solid var(--line);padding-left:10px;white-space:pre-wrap;overflow-wrap:anywhere}
.meta{display:flex;flex-direction:column;align-items:flex-end;gap:7px;padding-top:2px}
.due{font:500 13px var(--f-mono);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.3}
.due small{display:block;font:500 11.5px var(--f-body);color:var(--ink-3)}
.due.draft .d{border-bottom:1px dashed var(--ink-3)}
.due.soon small{color:var(--accent-ink)}
.due.overdue,.due.overdue small{color:var(--blocked)}
.due.none{color:var(--ink-3)}
.due.finished{color:var(--ink-3)}
@media (max-width:640px){
  .step{grid-template-columns:32px minmax(0,1fr)}
  .meta{grid-column:2;flex-direction:row;align-items:center;justify-content:space-between;gap:10px;padding-top:0}
  .due{text-align:left}
}
.add-step{display:flex;align-items:center;gap:8px;width:100%;border:0;border-top:1px dashed var(--line);background:transparent;padding:11px 18px;color:var(--accent-ink);font-weight:600;font-size:13.5px;cursor:pointer;text-align:left}
.add-step:hover{background:var(--surface-2)}
.empty-sec{padding:16px 18px;color:var(--ink-3);font-size:14px}
.add-sec{border:1px dashed var(--line);background:transparent;border-radius:12px;padding:12px 16px;color:var(--accent-ink);font-weight:600;font-size:14px;cursor:pointer;text-align:left}
.add-sec:hover{background:var(--surface)}

/* status select pill */
.sel{position:relative;display:inline-flex;align-items:center;border-radius:99px;color:var(--todo);background:var(--todo-soft)}
.sel select{appearance:none;-webkit-appearance:none;border:0;background:transparent;color:inherit;font:600 12.5px var(--f-body);padding:5px 28px 5px 25px;border-radius:99px;cursor:pointer;line-height:1.3}
.sel::before{content:"";position:absolute;left:10px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:currentColor;pointer-events:none}
.sel::after{content:"";position:absolute;right:11px;top:50%;width:6px;height:6px;margin-top:-5px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg);pointer-events:none}
.sel[data-s="doing"]{color:var(--doing);background:var(--doing-soft)}
.sel[data-s="blocked"]{color:var(--blocked);background:var(--blocked-soft)}
.sel[data-s="done"]{color:var(--done);background:var(--done-soft)}
.sel.ro select{cursor:default;padding-right:12px}
.sel.ro::after{display:none}
.sel select option{color:var(--ink);background:var(--surface)}
/* touch screens: 16px controls stop iOS from zooming in, and give a larger target */
@media (pointer:coarse){
  .sel select{font-size:16px;padding:8px 30px 8px 27px}
}

/* grouped lists (people / dates) */
.groups{display:grid;gap:16px}
.group{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.group-head{display:flex;align-items:center;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;padding:13px 18px;border-bottom:1px solid var(--line)}
.group-head h3{font-size:17px;font-weight:700}
.group-head .gstats{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.group-head .bar{width:110px}
.group.warn .group-head{background:var(--accent-soft)}
.group.danger .group-head h3{color:var(--blocked)}
.group-hint{font-size:13px;color:var(--ink-2);width:100%}
.crows{list-style:none;margin:0;padding:0}
.crow{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:6px 14px;align-items:start;padding:12px 18px}
.crow + .crow{border-top:1px solid var(--line)}
.sdot{width:10px;height:10px;border-radius:50%;margin-top:7px;background:var(--todo)}
.s-doing .sdot{background:var(--doing)} .s-blocked .sdot{background:var(--blocked)} .s-done .sdot{background:var(--done)}
.crumb{display:block;font-size:12.5px;color:var(--ink-3);margin-top:2px}
@media (max-width:640px){
  .crow{grid-template-columns:10px minmax(0,1fr)}
  .crow .meta{grid-column:2;flex-direction:row;align-items:center;justify-content:space-between;gap:10px}
  .crow .due{text-align:left}
}
.nomatch{padding:28px 20px;text-align:center;color:var(--ink-2);background:var(--surface);border:1px dashed var(--line);border-radius:12px;display:grid;gap:10px;justify-items:center}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn-primary:hover{background:var(--accent);filter:brightness(.95)}
.btn-danger{color:var(--blocked);border-color:transparent;background:transparent;padding-inline:8px}
.btn-danger:hover{background:var(--blocked-soft)}
.btn-danger[data-armed="1"]{background:var(--blocked);color:var(--on-sem);border-color:var(--blocked)}
.btn-sq{width:36px;padding:8px 0}
.btn:disabled{opacity:.45;cursor:default}

/* dialogs */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:0;width:min(600px,calc(100vw - 32px));max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);box-shadow:var(--shadow-lg)}
dialog::backdrop{background:rgba(6,10,14,.5)}
dialog form{display:flex;flex-direction:column;max-height:calc(100vh - 34px);max-height:calc(100dvh - 34px)}
.dlg-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.dlg-head h2{font-size:18px;font-weight:800}
.x-btn{border:0;background:transparent;width:34px;height:34px;border-radius:8px;cursor:pointer;color:var(--ink-2);font-size:22px;line-height:1}
.x-btn:hover{background:var(--surface-2)}
.dlg-body{padding:16px 20px 18px;display:grid;gap:14px;overflow:auto}
.dlg-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 20px;border-top:1px solid var(--line)}
.foot-group{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.field{display:grid;gap:6px;min-width:0}
.field>span{font-size:13px;font-weight:600;color:var(--ink-2)}
.field input,.field select,.field textarea{width:100%;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
.field textarea{resize:vertical;min-height:64px}
.field input[readonly],.field textarea[readonly]{background:var(--surface-2)}
.field input[aria-invalid="true"]{border-color:var(--blocked)}
.field .err{font-size:12.5px;color:var(--blocked)}
.field .hint{font-size:12.5px;color:var(--ink-3)}
/* must come after the base size above, or it never applies */
@media (pointer:coarse){.field input,.field select,.field textarea{font-size:16px}}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:end}
@media (max-width:520px){.row2{grid-template-columns:minmax(0,1fr)}}
.check{display:flex;align-items:center;gap:8px;font-size:14px;padding-bottom:10px;cursor:pointer}
.check input{width:17px;height:17px;accent-color:var(--accent)}
.dlg-meta{font-size:12.5px;color:var(--ink-3)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,8px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;max-width:calc(100vw - 32px);z-index:30;box-shadow:var(--shadow-lg)}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:no-preference){.toast{transition:opacity .2s,transform .2s}}
</style>
</head>

<script>
(function(){
'use strict';
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const STATUSES = [
  {k:'todo', label:'Boshlanmagan'},

  {k:'done', label:'Bajarildi'}
];
const ST = Object.create(null); STATUSES.forEach(s => { ST[s.k] = s; });
const stOf = t => (t && ST[t.status]) ? t.status : 'todo';
const MONTHS = ['yanvar','fevral','mart','aprel','may','iyun','iyul','avgust','sentabr','oktabr','noyabr','dekabr'];
const CHECK = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

const S = {
  db: null,
  projects: new Map(), sections: new Map(), tasks: new Map(),
  got: {projects:false, sections:false, tasks:false},
  confirmed: {projects:false, sections:false, tasks:false},
  error: null, phase: 'loading', slow: false,
  readOnly: false, writeKnown: false, pending: 0,
  view: 'overview', project: '', status: 'all', flag: null,
  secSel: {}, // project id -> the section sub-tab this viewer last opened
  snapshot: false, snapshotAt: '', // true when showing the copy built into the page (no live data for this viewer)
  site: false, // true on the public website, where the plan is stored in a database instead of claude.ai

};

const PREF_KEY = 'yol-xarita-prefs-3';
try {
  const p = JSON.parse(localStorage.getItem(PREF_KEY) || '{}');
  if (['overview','projects','people','dates'].includes(p.view)) S.view = p.view;
  if (typeof p.project === 'string') S.project = p.project;
  if (p.secSel && typeof p.secSel === 'object') Object.keys(p.secSel).forEach(k => { if (typeof p.secSel[k] === 'string') S.secSel[k] = p.secSel[k]; });
} catch (e) {}
function savePrefs(){ try { localStorage.setItem(PREF_KEY, JSON.stringify({view:S.view, project:S.project, secSel:S.secSel})); } catch (e) {} }

/* ---------- dates ---------- */
function todayMid(){ const d = new Date(); d.setHours(0,0,0,0); return d; }
function parseDate(s){
  if (typeof s !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return null;
  const a = s.split('-').map(Number); const d = new Date(a[0], a[1]-1, a[2]);
  // reject impossible dates such as 2027-02-30 instead of rolling them into March
  return (isNaN(d.getTime()) || d.getMonth() !== a[1]-1 || d.getDate() !== a[2]) ? null : d;
}
function daysLeft(s){ const d = parseDate(s); return d ? Math.round((d - todayMid()) / 86400000) : null; }
function pad(n){ return String(n).padStart(2,'0'); }
function fmtDate(s){ const d = parseDate(s); return d ? pad(d.getDate()) + '.' + pad(d.getMonth()+1) + '.' + d.getFullYear() : ''; }
function fmtToday(){ const d = new Date(); return d.getDate() + '-' + MONTHS[d.getMonth()] + ', ' + d.getFullYear(); }
function relText(n){
  if (n == null) return '';
  if (n === 0) return 'bugun';
  if (n === 1) return 'ertaga';
  if (n < 0) return (-n) + ' kun kechikdi';
  if (n > 60) return Math.round(n / 30.4) + ' oy qoldi';
  return n + ' kun qoldi';
}
function fmtStamp(iso){ const d = new Date(iso); if (isNaN(d.getTime())) return ''; return pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear()+' '+pad(d.getHours())+':'+pad(d.getMinutes()); }

/* ---------- documents ---------- */
// The plan can be edited by anyone who has the link, so a document may hold anything.
// Keep plain values only (and "terms" as a list of text), so one odd value cannot stop the page for everyone.
function clean(v){
  const o = {};
  if (!v || typeof v !== 'object') return o;
  Object.keys(v).forEach(k => {
    const x = v[k], t = typeof x;
    if (t === 'string' || t === 'boolean' || (t === 'number' && isFinite(x))) o[k] = x;
    else if (k === 'terms' && Array.isArray(x)) o[k] = x.filter(y => typeof y === 'string').slice(0, 20);
  });
  return o;
}

/* ---------- derived index ---------- */
const num = x => { const n = Number(x); return isFinite(n) ? n : 1e9; };
const byOrder = (a, b) => (num(a.order) - num(b.order)) || String(a.id).localeCompare(String(b.id));
function buildIndex(){
  const projects = [...S.projects.values()].sort(byOrder);
  const idx = {projects, secs: new Map(), tasks: new Map(), meta: new Map(), all: []};
  const secsAll = [...S.sections.values()].sort(byOrder);
  const tasksAll = [...S.tasks.values()].sort(byOrder);
  projects.forEach((p, pi) => {
    const secs = secsAll.filter(s => s.projectId === p.id);
    idx.secs.set(p.id, secs);
    secs.forEach(s => {
      const ts = tasksAll.filter(t => t.sectionId === s.id);
      idx.tasks.set(s.id, ts);
      const cur = nowStep(ts); // same rule as the overview, so both screens agree on the current step
      ts.forEach((t, i) => { idx.meta.set(t.id, {n: i+1, p, pn: pi+1, s, current: t === cur}); idx.all.push(t); });
    });
  });
  return idx;
}
function isOverdue(t){ const n = daysLeft(t.deadline); return stOf(t) !== 'done' && n != null && n < 0; }
function isSoon(t){ const n = daysLeft(t.deadline); return stOf(t) !== 'done' && n != null && n >= 0 && n <= 14; }
// "Muhammadjon aka, Sherzodbek" -> two people; one step or project can have several
const nameKey = s => String(s).toLowerCase().replace(/[‘’ʻʼ`]/g, "'");
function names(v){
  const seen = new Set();
  return String(v || '').split(',').map(x => x.trim().replace(/\s+/g, ' ')).filter(x => { const k = nameKey(x); if (!x || seen.has(k)) return false; seen.add(k); return true; });
}
const ownerText = t => names(t.owner).join(', ');
function isUnassigned(t){ return !names(t.owner).length; }
function isDraft(t){ return !!(t.deadlineDraft && t.deadline); }
const FLAGS = {
  overdue: {label:'Kechikkan', test:isOverdue, cls:'alert'},
  soon: {label:'Dedlayni 14 kun ichida', test:isSoon, cls:'warn'},
  unassigned: {label:'Mas’ul tayinlanmagan', test:isUnassigned, cls:'warn'},
  draft: {label:'Taxminiy dedlayn', test:isDraft, cls:''}
};
// the Mas’ullar and Dedlaynlar lists cover every project; an overview number can narrow them to one status or flag
function matches(idx, t){
  if (S.status !== 'all' && stOf(t) !== S.status) return false;
  if (S.flag && FLAGS[S.flag] && !FLAGS[S.flag].test(t)) return false;
  return true;
}
function counts(list){ const c = {todo:0, doing:0, blocked:0, done:0, total:list.length}; list.forEach(t => { c[stOf(t)]++; }); return c; }
function barHTML(c){
  const t = c.total || 1;
  return '<span class="bar" role="img" aria-label="' + c.done + ' bajarildi, ' + c.doing + ' jarayonda, ' + c.blocked + ' to‘xtagan, ' + c.todo + ' boshlanmagan">' +
    '<i class="b-done" style="width:' + (c.done/t*100) + '%"></i><i class="b-doing" style="width:' + (c.doing/t*100) + '%"></i><i class="b-blocked" style="width:' + (c.blocked/t*100) + '%"></i></span>';
}

/* ---------- render ---------- */
let renderTimer = 0;
function scheduleRender(){ if (renderTimer) return; renderTimer = setTimeout(() => { renderTimer = 0; render(); }, 16); }
function canWrite(){ return !!S.db && !S.readOnly; }

function render(){
  try { draw(); }
  catch (e) {
    $('#main').innerHTML = '<section class="notice"><span class="label">Xatolik</span><h2>Rejani ko‘rsatib bo‘lmadi</h2><p>Rejadagi yozuvlardan biri buzilgan ko‘rinadi. Sahifani yangilab ko‘ring; takrorlansa, reja egasiga xabar bering.</p></section>';
  }
}
function draw(){
  const ae = document.activeElement;
  const fk = ae && ae.dataset ? ae.dataset.fk : null;
  const fkAlt = ae && ae.dataset ? ae.dataset.fkAlt : null; // where focus goes if that control disappears
  document.querySelectorAll('.tab').forEach(b => { if (b.dataset.v === S.view) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
  $('#newProjectBtn').hidden = !(canWrite() && S.phase === 'ready');
  const main = $('#main');
  if (S.phase === 'nodb') {
    main.innerHTML = '<section class="notice"><span class="label">Ma’lumotlar ombori</span><h2>Reja bu yerda ochilmaydi</h2><p>Loyihalar, mas’ullar va dedlaynlar claude.ai’da saqlanadi. Sahifani claude.ai ichida, hisobingizga kirgan holda oching.</p></section>';
    return;
  }
  if (S.error) {
    main.innerHTML = '<section class="notice"><span class="label">Xatolik</span><h2>Rejani o‘qib bo‘lmadi</h2><p>Ma’lumotlar omboriga ulanish uzildi (' + esc(S.error) + '). Sahifani biroz keyin qayta oching.</p></section>';
    return;
  }
  if (S.phase !== 'ready') {
    main.innerHTML = (S.slow ? '<p class="banner">Ma’lumotlarga hozircha ulanib bo‘lmadi. Internet aloqasini tekshiring — sahifa o‘zi qayta urinyapti.</p>' : '') +
      '<div class="loading-rows" aria-label="Reja yuklanmoqda"><span></span><span></span><span></span></div>';
    return;
  }
  const idx = buildIndex();
  fillOwnerList(idx);
  if (idx.projects.length) $('.brand p').textContent = idx.projects.map(shortName).join(' → ');
  let html = '';
  if (S.slow) html += '<p class="banner">Ulanish sekin: ko‘rsatilayotgan holat eskirgan bo‘lishi mumkin.</p>';
  if (S.snapshot && S.moved) html += '<p class="banner">Reja endi saytda yuritiladi: <a href="' + esc(S.moved) + '" target="_blank" rel="noopener">' + esc(S.moved.replace(/^https?:\/\//, '')) + '</a>. Quyida rejaning ' + esc(fmtDate(S.snapshotAt) || 'oldingi') + ' holatidagi nusxasi, faqat ko‘rish uchun.</p>';
  else if (S.snapshot && S.site) html += '<p class="banner">Ma’lumotlarga ulanib bo‘lmadi. Quyida rejaning ' + esc(fmtDate(S.snapshotAt) || 'oldingi') + ' holatidagi nusxasi, faqat ko‘rish uchun. <button type="button" class="link-btn" data-act="reload" data-fk="reload">Qayta urinish</button></p>';
  else if (S.snapshot && S.snapshotPublic) html += '<p class="banner">Rejaning ' + esc(fmtDate(S.snapshotAt) || 'oxirgi') + ' holati. Bu sahifa faqat ko‘rish uchun.</p>';
  else if (S.snapshot) html += '<p class="banner">' + (S.snapshotLost
    ? 'Jonli ma’lumotga ulanib bo‘lmadi. Quyida rejaning ' + esc(fmtDate(S.snapshotAt) || 'oldingi') + ' holatidagi nusxasi, faqat ko‘rish uchun. Sahifani keyinroq qayta oching.'
    : 'Bu rejaning ' + esc(fmtDate(S.snapshotAt) || 'oldingi') + ' holatidagi nusxasi. Siz uni faqat ko‘ra olasiz. Eng yangi holatni ko‘rish uchun claude.ai’ga kiring.') + '</p>';
  else if (S.readOnly) html += '<p class="banner">Siz rejani faqat ko‘ra olasiz. O‘zgartirish uchun sahifa egasidan ruxsat so‘rang.</p>';
  if (!idx.projects.length) {
    html += '<section class="notice"><span class="label">Reja bo‘sh</span><h2>Hali loyiha qo‘shilmagan</h2><p>' + (canWrite() ? 'Loyiha qo‘shing, so‘ng uning bo‘limlari va qadamlarini kiriting: kim qiladi, nimaga mas’ul, dedlayn va holat.' : 'Reja egasi hali loyiha qo‘shmagan.') + '</p>' +
      (canWrite() ? '<p><button class="btn btn-primary" type="button" data-act="new-project">+ Loyiha qo‘shish</button></p>' : '') + '</section>';
    main.innerHTML = html; restoreFocus(fk, fkAlt); return;
  }
  if (S.view === 'people') html += filterBarHTML() + peopleHTML(idx);
  else if (S.view === 'dates') html += filterBarHTML() + datesHTML(idx);
  else if (S.view === 'projects') html += projectsHTML(idx);
  else html += overviewHTML(idx);
  const keepX = [...main.querySelectorAll('.subtabs,.sectabs')].map(r => r.scrollLeft);
  main.innerHTML = html;
  // a rebuilt sub-tab row starts scrolled to the left; keep where the viewer was and bring the open tab into view
  main.querySelectorAll('.subtabs,.sectabs').forEach((row, i) => {
    if (keepX[i]) row.scrollLeft = keepX[i];
    const a = row.querySelector('[aria-current="true"]');
    if (!a || row.scrollWidth <= row.clientWidth) return;
    const rb = row.getBoundingClientRect(), ab = a.getBoundingClientRect();
    if (ab.left < rb.left || ab.right > rb.right) row.scrollLeft += (ab.left - rb.left) - (rb.width - ab.width) / 2;
  });
  restoreFocus(fk, fkAlt);
}
function restoreFocus(fk, alt){
  // in the Mas’ullar list a key ends in "@person": if the step moved to someone else, follow the step
  const at = fk ? fk.indexOf('@') : -1, stem = at > 0 ? fk.slice(0, at + 1) : '';
  for (const k of [fk, stem, alt]) {
    if (!k) continue;
    const el = k === stem ? [...document.querySelectorAll('[data-fk]')].find(e => e.dataset.fk.startsWith(stem))
      : document.querySelector('[data-fk="' + (window.CSS && CSS.escape ? CSS.escape(k) : k) + '"]');
    if (el) { if (el !== document.activeElement) { try { el.focus({preventScroll:true}); } catch (e) {} } return; }
  }
}
function fillOwnerList(idx){
  const seen = new Map();
  const add = n => { const k = nameKey(n); if (!seen.has(k)) seen.set(k, n); };
  idx.all.forEach(t => names(t.owner).forEach(add));
  idx.projects.forEach(p => names(p.lead).forEach(add));
  idx.all.forEach(t => { const ns = names(t.owner); if (ns.length > 1) add(ns.join(', ')); }); // a pair already in use can be picked whole
  $('#ownerList').innerHTML = [...seen.values()].sort((a,b) => a.localeCompare(b)).map(o => '<option value="' + esc(o) + '"></option>').join('');
}

/* ---------- overview (one screen) ---------- */
// the step a project or section is on: something in progress, else something stuck, else the first not done
function nowStep(ts){ return ts.find(t => stOf(t) === 'doing') || ts.find(t => stOf(t) === 'blocked') || ts.find(t => stOf(t) !== 'done') || null; }
// "Hozir" only for work that has really started; a not-started step is next in line
const NOW_LABEL = {doing: 'Hozir', blocked: 'To‘xtab qolgan', todo: 'Navbatda'};
function shortName(p){
  // "Garaj (to‘liq model)" -> "Garaj"
  const n = String(p.name || ''), e = n.trimEnd();
  if (e.endsWith(')')) { const i = e.indexOf('('); const s = i > 0 ? e.slice(0, i).trimEnd() : ''; if (s) return s; }
  return n;
}
function projectTasks(idx, pid){ return idx.all.filter(t => idx.meta.get(t.id).p.id === pid); }
function overviewHTML(idx){
  const all = idx.all, c = counts(all);
  const nLate = all.filter(isOverdue).length, nUn = all.filter(isUnassigned).length;
  const kpi = (n, label, cls, attrs) => '<button type="button" class="kpi ' + (n ? cls : 'zero') + '" ' + attrs + (n ? '' : ' disabled') + '><strong>' + n + '</strong><span>' + label + '</span></button>';
  const cards = idx.projects.map((p, i) => {
    const ts = projectTasks(idx, p.id), pc = counts(ts), now = nowStep(ts);
    const late = ts.filter(isOverdue).length;
    let next;
    if (now) {
      const owner = ownerText(now), n = daysLeft(now.deadline), st = stOf(now);

function datesHTML(idx){
  const list = idx.all.filter(t => matches(idx, t));
  if (!list.length) return noMatchHTML();
  const byDate = (a, b) => a.deadline.localeCompare(b.deadline) || idx.all.indexOf(a) - idx.all.indexOf(b);
  const overdue = list.filter(isOverdue).sort(byDate);
  const months = new Map(); const none = [];
  list.forEach(t => {
    if (isOverdue(t)) return;
    if (!parseDate(t.deadline)) { none.push(t); return; }
    const k = t.deadline.slice(0, 7);
    if (!months.has(k)) months.set(k, []);
    months.get(k).push(t);
  });
  let out = '';
  const group = (title, ts, cls, hint) => {
    const c = counts(ts);
    return '<section class="group' + (cls ? ' ' + cls : '') + '"><header class="group-head"><h3>' + title + '</h3>' +

  };
  if (overdue.length) out += group('Kechikkan', overdue, 'danger', 'Bu qadamlarning dedlayni o‘tib ketdi.' + (canWrite() ? ' Holatini yangilang yoki yangi dedlayn kelishing.' : ''));
  [...months.keys()].sort().forEach(k => {
    const [y, mo] = k.split('-').map(Number);

    out += group(esc(label), months.get(k).sort(byDate), '', '');
  });
  if (none.length) out += group('Dedlayn belgilanmagan', none, 'warn', canWrite() ? 'Har bir qadamga dedlayn qo‘ying, shunda kechikish ko‘rinib turadi.' : '');
  return '<div class="groups">' + out + '</div>';
}

/* ---------- writes ---------- */
const queues = new Map();
const sleep = ms => new Promise(r => setTimeout(r, ms));
function setSaving(){
  const el = $('#saveState');
  if (S.pending > 0) { el.textContent = 'Saqlanmoqda…'; return; }
  el.textContent = 'Saqlandi';
  clearTimeout(setSaving._t); setSaving._t = setTimeout(() => { if (!S.pending) el.textContent = ''; }, 2500);
}
function write(path, fn){
  if (!canWrite()) return Promise.reject({code:'read_only'});
  const prev = queues.get(path) || Promise.resolve();
  S.pending++; setSaving();
  const next = prev.catch(() => {}).then(() => attempt(path, fn, false)).finally(() => { S.pending--; setSaving(); });
  queues.set(path, next);
  return next;
}
async function attempt(path, fn, retried){
  try { return await fn(S.db.doc(path)); }
  catch (e) {
    if (e && e.code === 'unavailable' && !retried) { await sleep(400 + Math.random() * 800); return attempt(path, fn, true); }
    writeFailed(e); throw e;
  }
}
let lastErrToast = 0;
function writeFailed(e){
  const code = e && e.code;
  if (code === 'not_granted' || code === 'revoked' || (code === 'invalid_argument' && !S.writeKnown)) {
    if (!S.readOnly) { S.readOnly = true; toast('Bu rejani o‘zgartirish huquqingiz yo‘q — o‘zgarish saqlanmadi.'); closeDialogs(); render(); }
    return;
  }
  if (Date.now() - lastErrToast < 1500) return;
  lastErrToast = Date.now();
  if (code === 'not_found') { toast('Bu qadam o‘chirib yuborilgan — o‘zgarish saqlanmadi.'); return; }
  if (code === 'quota_exceeded') toast('Ombor to‘ldi: keraksiz qadamlarni o‘chirib, qayta urinib ko‘ring.');
  else if (code === 'resource_exhausted') toast('Juda tez o‘zgartirilyapti. Biroz kutib, qayta urinib ko‘ring.');
  else toast('Saqlanmadi. Internet aloqasini tekshirib, qayta urinib ko‘ring.');
}
function base(obj){ const b = Object.assign({}, obj || {}); delete b.id; return b; }
const nowIso = () => new Date().toISOString();
function nextOrder(list){ return list.reduce((m, x) => Math.max(m, num(x.order) < 1e9 ? num(x.order) : 0), 0) + 1; }

function setStatus(id, st){
  const t = S.tasks.get(id); if (!t || stOf(t) === st || !ST[st]) return;
  write('tasks/' + id, r => r.update({status: st, updatedAt: nowIso()})).then(() => toast('Holat: ' + ST[st].label)).catch(() => { scheduleRender(); });
}

  try {

    return c && typeof c.url === 'string' && c.url && typeof c.key === 'string' && c.key ? c : null;

  // one failed listener ends live mode for all three, so live and copied data never mix
  const unsubs = []; let live = true;
  ['projects','sections','tasks'].forEach(name => {
    unsubs.push(db.collection(name).onSnapshot(snap => {
      if (!live) return;
      const m = new Map();
      snap.docs.forEach(d => { if (d.exists) m.set(d.id, Object.assign(clean(d.data()), {id: d.id})); });
      S[name] = m;
      S.got[name] = true;
      if (!snap.metadata.fromCache) S.confirmed[name] = true;
      if (S.got.projects && S.got.sections && S.got.tasks) S.phase = 'ready';
      if (S.confirmed.projects && S.confirmed.sections && S.confirmed.tasks) { clearTimeout(slowTimer); S.slow = false; }
      scheduleRender();
      if (TD.open) updateTaskMeta();
    }, err => {
      clearTimeout(slowTimer);
      if (!live) return;
      live = false;
      unsubs.forEach(u => { try { if (typeof u === 'function') u(); } catch (e) {} });
      const hadDialog = TD.open || MD.open;
      closeDialogs();
      if (hadDialog) toast('Ulanish uzildi — o‘zgarish saqlanmadi.');
      if (loadSnapshot()) { S.snapshotLost = true; scheduleRender(); return; } // show the built-in copy instead of an error
      S.error = (err && err.code) || 'unavailable';
      if (err && err.code === 'revoked') S.readOnly = true;
      scheduleRender();
    }));
  });
})();
})();
</script>
